#
# https://github.com/P3TERX/Actions-OpenWrt
#
# File: .github/workflows/openwrt-builder.yml
# Description: Build ImmortalWrt 24.10 / Kernel 6.6 for 360T7
#

name: 编译 ImmortalWrt 24.10 Kernel 6.6 (360T7 纯净版)

on:
  repository_dispatch:
  workflow_dispatch:
  schedule:
    # UTC 20:00 = 北京时间周一 04:00
    - cron: '0 20 * * 0'

permissions:
  contents: write

env:
  # ==========================================================
  # ImmortalWrt
  # ==========================================================
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x-6.6
  REPO_BRANCH: openwrt-24.10-6.6

  # ==========================================================
  # Build files
  # ==========================================================
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: 2410-6.6-360t7.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  RELEASE_FILE: 2410-6.6-release.txt

  # ==========================================================
  # Output
  # ==========================================================
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true

  TZ: Asia/Shanghai

jobs:
  build:
    name: Build 360T7
    runs-on: ubuntu-22.04

    steps:

    # ==========================================================
    # 1. Checkout workflow repository
    # ==========================================================
    - name: 检查代码仓库
      uses: actions/checkout@main

    # ==========================================================
    # 2. Prepare build environment
    # ==========================================================
    - name: 初始化编译环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf \
          /etc/apt/sources.list.d/* \
          /usr/share/dotnet \
          /usr/local/lib/android \
          /opt/ghc \
          /opt/hostedtoolcache/CodeQL

        sudo docker image prune --all --force

        sudo -E apt-get -qq update

        sudo -E apt-get -qq install \
          ack \
          antlr3 \
          asciidoc \
          autoconf \
          automake \
          autopoint \
          binutils \
          bison \
          build-essential \
          bzip2 \
          ccache \
          clang \
          cmake \
          cpio \
          curl \
          device-tree-compiler \
          ecj \
          fastjar \
          flex \
          gawk \
          gettext \
          gcc-multilib \
          g++-multilib \
          git \
          gnutls-dev \
          gperf \
          haveged \
          help2man \
          intltool \
          lib32gcc-s1 \
          libc6-dev-i386 \
          libelf-dev \
          libglib2.0-dev \
          libgmp3-dev \
          libltdl-dev \
          libmpc-dev \
          libmpfr-dev \
          libncurses-dev \
          libpython3-dev \
          libreadline-dev \
          libssl-dev \
          libtool \
          libyaml-dev \
          libz-dev \
          lld \
          llvm \
          lrzsz \
          mkisofs \
          msmtp \
          nano \
          ninja-build \
          p7zip \
          p7zip-full \
          patch \
          pkgconf \
          python3 \
          python3-pip \
          python3-ply \
          python3-docutils \
          python3-pyelftools \
          qemu-utils \
          re2c \
          rsync \
          scons \
          squashfs-tools \
          subversion \
          swig \
          texinfo \
          uglifyjs \
          unzip \
          vim \
          wget \
          xmlto \
          xxd \
          zlib1g-dev \
          zstd

        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean

        sudo timedatectl set-timezone "$TZ"

        sudo mkdir -p /workdir
        sudo chown "$USER:$GROUPS" /workdir

        echo "=================================================="
        echo "Build environment ready"
        echo "=================================================="

    # ==========================================================
    # 3. Clone ImmortalWrt source
    # ==========================================================
    - name: 克隆 ImmortalWrt 源码
      working-directory: /workdir
      run: |
        df -hT "$PWD"

        git clone \
          --depth=1 \
          -b "$REPO_BRANCH" \
          "$REPO_URL" \
          openwrt

        ln -sf /workdir/openwrt "$GITHUB_WORKSPACE/openwrt"

        cd /workdir/openwrt

        echo "=================================================="
        echo "Repository:"
        git remote -v

        echo "Branch:"
        git branch --show-current

        echo "Commit:"
        git log -1 --oneline
        echo "=================================================="

    # ==========================================================
    # 4. Load custom feeds
    # ==========================================================
    - name: 加载自定义 Feeds 配置
      run: |
        if [ -e "$FEEDS_CONF" ]; then
          mv "$FEEDS_CONF" openwrt/feeds.conf.default
        fi

        chmod +x "$DIY_P1_SH"

        cd openwrt

        "$GITHUB_WORKSPACE/$DIY_P1_SH"

    # ==========================================================
    # 5. Update feeds
    # ==========================================================
    - name: 更新 Feeds 源
      run: |
        cd openwrt

        ./scripts/feeds update -a

    # ==========================================================
    # 6. Install feeds packages
    # ==========================================================
    - name: 安装 Feeds 软件包
      run: |
        cd openwrt

        ./scripts/feeds install -a

    # ==========================================================
    # 7. Load config and DIY script
    # ==========================================================
    - name: 加载 360T7 配置
      run: |
        if [ -e "$CONFIG_FILE" ]; then
          mv "$CONFIG_FILE" openwrt/.config
        else
          echo "ERROR: 找不到 $CONFIG_FILE"
          exit 1
        fi

        chmod +x "$DIY_P2_SH"

        cd openwrt

        "$GITHUB_WORKSPACE/$DIY_P2_SH"

    # ==========================================================
    # 8. Generate final config
    # ==========================================================
    - name: 生成最终配置
      run: |
        cd openwrt

        echo "=================================================="
        echo "Running make defconfig"
        echo "=================================================="

        make defconfig

        echo "=================================================="
        echo "Target configuration:"
        grep '^CONFIG_TARGET_' .config | grep '=y' || true

        echo "=================================================="
        echo "Device configuration:"
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config || true

        echo "=================================================="
        echo "Kernel configuration:"
        grep '^CONFIG_KERNEL_' .config | grep '=y' || true
        echo "=================================================="

    # ==========================================================
    # 9. Download packages
    # ==========================================================
    - name: 下载依赖软件包
      id: package
      run: |
        cd openwrt

        make download -j8

        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    # ==========================================================
    # 10. Compile firmware
    # ==========================================================
    - name: 编译固件
      id: compile
      run: |
        cd openwrt

        echo "=================================================="
        echo "CPU threads: $(nproc)"
        echo "Start compiling..."
        echo "=================================================="

        make -j"$(nproc)" V=s

        echo "status=success" >> "$GITHUB_OUTPUT"

        grep '^CONFIG_TARGET.*DEVICE.*=y' .config \
          | sed -r 's/.*DEVICE_(.*)=y/\1/' \
          > DEVICE_NAME

        if [ -s DEVICE_NAME ]; then
          echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> "$GITHUB_ENV"
        fi

        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> "$GITHUB_ENV"

    # ==========================================================
    # 11. Check disk space
    # ==========================================================
    - name: 检查磁盘空间占用
      if: always()
      run: |
        echo "=================================================="
        echo "Disk usage"
        echo "=================================================="
        df -hT

    # ==========================================================
    # 12. Upload bin directory
    # ==========================================================
    - name: 上传 bin 目录 artifacts
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    # ==========================================================
    # 13. Organize firmware
    # ==========================================================
    - name: 整理编译好的固件文件
      id: organize
      if: steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*

        rm -rf packages

        echo "FIRMWARE=$PWD" >> "$GITHUB_ENV"
        echo "status=success" >> "$GITHUB_OUTPUT"

        echo "=================================================="
        echo "Firmware directory:"
        echo "$PWD"
        echo "=================================================="

        ls -lah

    # ==========================================================
    # 14. Upload firmware artifact
    # ==========================================================
    - name: 上传固件 artifacts
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    # ==========================================================
    # 15. Generate release tag
    # ==========================================================
    - name: 生成 Release 标签
      id: tag
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> "$GITHUB_OUTPUT"

        touch "${RELEASE_FILE}"

        echo "status=success" >> "$GITHUB_OUTPUT"

    # ==========================================================
    # 16. Publish release
    # ==========================================================
    - name: 发布固件到 Release 页面
      uses: softprops/action-gh-release@v2
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: ${{ env.RELEASE_FILE }}
        files: ${{ env.FIRMWARE }}/*

    # ==========================================================
    # 17. Delete old workflow runs
    # ==========================================================
    - name: 清理历史 Workflow 运行记录
      uses: Mattraks/delete-workflow-runs@main
      if: always()
      with:
        retain_days: 0
        keep_minimum_runs: 2

    # ==========================================================
    # 18. Delete old releases
    # ==========================================================
    - name: 删除旧的 Release 发布包
      uses: dev-drprasad/delete-older-releases@master
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      with:
        keep_latest: 12
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
